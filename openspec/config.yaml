schema: spec-driven

# 项目上下文
# 只包含引用代码也无法推断出的约束，用于指导 OpenSpec 工件与工作流生成。
context: |
  项目：个人品牌站（Personal Website）
  技术栈：React 19 + Vite 7 + TypeScript + Tailwind CSS V4
  部署：GitHub Pages，base path 为 /my-website/
  设计风格：科技感，动态粒子背景，支持亮/暗模式切换
  性能：首屏加载 < 2s，所有图片使用 lazy loading

  语言：所有工件（proposal、specs、tasks 等）使用简体中文生成；
  代码相关术语（如组件名、路径、命令）保留英文。

# 各工件的自定义规则
rules:
  proposal:
    - 必须明确写出 out-of-scope（不做什么）
    - 必须评估对现有功能的影响
  specs:
    - 使用 Given/When/Then 格式描述交互行为
    - 每个 Spec 必须包含至少一个边界/异常场景
  tasks:
    - 每个任务粒度不超过 30 分钟
    - 按 Phase 分组，每个 Phase 结束后等待用户确认，确认后才进入下一 Phase
